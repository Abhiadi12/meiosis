# Tools installed with `go install` live in $(go env GOPATH)/bin, which is often
# not on PATH, so each command adds it itself.
#
# Git hooks (the Go-ecosystem equivalent of husky). Install once with
# `make hooks`; skip in an emergency with `LEFTHOOK=0 git commit ...`.
# Docs: https://lefthook.dev

min_version: 1.7.0

commit-msg:
  commands:
    conventional-commit:
      # tools/commitlint is the Go replacement for npm commitlint.
      run: go run ./tools/commitlint {1}

pre-commit:
  parallel: true
  commands:
    format:
      # gofumpt (a stricter gofmt) + goimports, as configured for golangci-lint.
      glob: "*.go"
      run: export PATH="$(go env GOPATH)/bin:$PATH" && golangci-lint fmt {staged_files} && git add {staged_files}
      stage_fixed: true
    mod-tidy:
      glob: "{go.mod,go.sum}"
      run: make tidy-check

pre-push:
  commands:
    lint:
      run: export PATH="$(go env GOPATH)/bin:$PATH" && golangci-lint run
