name: CI

on:
  push:
    branches: [ main, dev, "feat/**" ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Formatting
        run: make fmt-check
      - name: Vet
        run: make vet
      - name: go.mod is tidy
        run: make tidy-check
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m
      - name: Vulnerabilities
        run: make vuln

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: make build
      - name: Test
        run: make test

  # The exit-criterion walkthrough, the adversarial scenarios and the air-gap
  # check drive the real binaries (internal/acceptance). They also run in
  # `make test`; this job makes lsof a hard requirement so the socket
  # inspection can never be skipped silently.
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Ensure lsof
        run: command -v lsof >/dev/null || sudo apt-get install -y lsof
      - name: Acceptance
        run: make acceptance

  # A second implementation of the format's hashing and signing must agree with
  # the Go one on the known-answer vectors.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install blake3 cryptography
      - run: make vectors

  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Every release target builds without cgo
        run: make cross
